name: Cleanup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the folders that would be removed"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute cleanup script
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python3 .github/cleanup.py $([ "$DRY_RUN" = "true" ] && echo --dry-run)
      - name: Commit and push removals
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ -z "$(git status --porcelain -- tokens testnet/tokens devnet/tokens)" ]; then
            echo "Nothing to clean up."
            exit 0
          fi
          git config user.name "GitHub Cleanup Bot"
          git config user.email "<>"
          git add -A tokens testnet/tokens devnet/tokens
          git commit -m "Cleanup"
          git pull --rebase origin master
          git push origin HEAD:master
